# StethoSpeech Phase 5 Unit HiFi-GAN Vocoder Configuration
# Model: Unit HiFi-GAN Generator (13,375,809 parameters)
# Quantizer: 1,000-centroid MiniBatchKMeans (mHuBERT Layer 11)
# Upsampling: [5, 4, 4, 2, 2] -> 320x expansion (50 Hz frames -> 16kHz audio)

experiment_name: "phase_5_unit_vocoder"

quantizer:
  num_units: 1000
  feature_dim: 768
  random_state: 42
  checkpoint_path: "checkpoints/mhubert_km1000.bin"

vocoder:
  num_units: 1000
  emb_dim: 128
  upsample_initial_channel: 512
  upsample_rates: [5, 4, 4, 2, 2]
  upsample_kernel_sizes: [11, 8, 8, 4, 4]
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes:
    - [1, 3, 5]
    - [1, 3, 5]
    - [1, 3, 5]
  weights_path: "checkpoints/matched_vocoder.pt"
  sample_rate: 16000
